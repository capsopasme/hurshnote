name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: never
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  # 跨平台 crate：格式检查、单元测试、clippy
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 安装工具链
        run: rustup toolchain install || rustup show

      - uses: Swatinem/rust-cache@v2

      - name: 格式检查
        run: python3 scripts/ci_run.py 格式检查 -- cargo fmt --all --check

      - name: Clippy
        run: python3 scripts/ci_run.py Clippy -- cargo clippy -p hn-text -p hn-search -p hn-crypto -p hn-core -p hn-large -p hn-run -p hn-term --all-targets -- -D warnings

      - name: 测试
        run: python3 scripts/ci_run.py 测试 -- cargo test -p hn-text -p hn-search -p hn-crypto -p hn-core -p hn-large -p hn-run -p hn-term

  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: 安装工具链
        run: rustup toolchain install || rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: python scripts/ci_run.py Clippy -- cargo clippy --workspace --all-targets -- -D warnings

      - name: 测试
        run: python scripts/ci_run.py 测试 -- cargo test --workspace

      - name: 构建 Release
        run: python scripts/ci_run.py 构建 -- cargo build --release

      - name: 检查依赖的 DLL（CRT 必须静态链接）
        run: python scripts/check_pe_imports.py target/release/hurshnote.exe

      - name: 启动自测
        shell: pwsh
        run: |
          function Fail($msg) { Write-Host "::error title=启动自测::$msg"; exit 1 }
          $exe = "target\release\hurshnote.exe"
          "exe 大小：{0:N2} MB" -f ((Get-Item $exe).Length / 1MB)
          $times = @()
          for ($i = 1; $i -le 5; $i++) {
            $out = Join-Path $env:RUNNER_TEMP "selftest-$i.txt"
            $p = Start-Process -FilePath $exe -ArgumentList '--selftest', $out -PassThru
            if (-not $p.WaitForExit(60000)) { $p.Kill(); Fail "第 $i 次自测超时" }
            if (-not (Test-Path $out)) { Fail "第 $i 次自测没有输出（退出码 $($p.ExitCode)）" }
            $report = Get-Content $out
            if ($i -eq 1) { $report | Write-Host; Copy-Item $out selftest.txt }
            if (-not ($report -contains 'result=pass')) { Fail ("第 $i 次自测失败%0A" + ($report -join '%0A')) }
            $ms = [double](($report | Where-Object { $_ -like 'startup_ms=*' }) -replace 'startup_ms=', '')
            $times += $ms
          }
          $sorted = $times | Sort-Object
          $median = $sorted[2]
          "启动耗时（ms）：$($times -join ', ')；中位数 $median"
          "startup_ms_median=$median" | Add-Content selftest.txt
          $sz = "exe_mb={0:N2}" -f ((Get-Item $exe).Length / 1MB)
          Write-Host ("::notice title=自测结果::" + ((Get-Content selftest.txt) -join '%0A') + "%0A$sz")
          if ($median -gt 150) { Write-Host "::warning::启动耗时中位数 $median ms，超过 150 ms 目标" }

      - name: 会话强杀测试
        shell: pwsh
        run: |
          function Fail($msg) { Write-Host "::error title=会话强杀测试::$msg"; exit 1 }
          $exe = (Resolve-Path "target\release\hurshnote.exe").Path
          $env:HURSHNOTE_DATA_DIR = Join-Path $env:RUNNER_TEMP "hn-data"
          Remove-Item -Recurse -Force $env:HURSHNOTE_DATA_DIR -ErrorAction SilentlyContinue
          $n = 20
          $pass = 0
          for ($i = 1; $i -le $n; $i++) {
            $marker = "KILLTEST-$i-" + [guid]::NewGuid().ToString("N")
            $ready = Join-Path $env:RUNNER_TEMP "ready-$i.txt"
            $p = Start-Process -FilePath $exe -ArgumentList '--selftest-session', 'write', $marker, $ready -PassThru
            $t = 0
            while (-not (Test-Path $ready) -and $t -lt 300) { Start-Sleep -Milliseconds 100; $t++ }
            if (-not (Test-Path $ready)) { $p.Kill(); Fail "第 $i 轮：写入阶段没有就绪" }
            Stop-Process -Id $p.Id -Force
            $p.WaitForExit(10000) | Out-Null
            $out = Join-Path $env:RUNNER_TEMP "check-$i.txt"
            $c = Start-Process -FilePath $exe -ArgumentList '--selftest-session', 'check', $marker, $out -PassThru
            if (-not $c.WaitForExit(60000)) { $c.Kill(); Fail "第 $i 轮：检查阶段超时" }
            if (-not (Test-Path $out)) { Fail "第 $i 轮：检查阶段没有输出（退出码 $($c.ExitCode)）" }
            $r = Get-Content $out
            if ($r -contains 'found=1') { $pass++ } else { Fail ("第 $i 轮没有恢复：" + ($r -join ' ')) }
          }
          Write-Host "::notice title=会话强杀测试::强杀 $n 次，恢复 $pass 次"

      - name: 大文件性能测试（5 GB 日志）
        shell: pwsh
        run: |
          function Fail($msg) { Write-Host "::error title=大文件性能测试::$msg"; exit 1 }
          $exe = (Resolve-Path "target\release\hurshnote.exe").Path
          $big = Join-Path $env:RUNNER_TEMP "big-5g.log"
          python scripts/gen_big_log.py $big 5120
          if (-not (Test-Path $big)) { Fail "生成测试文件失败" }
          $out = Join-Path $env:RUNNER_TEMP "large.txt"
          $env:HURSHNOTE_DATA_DIR = Join-Path $env:RUNNER_TEMP "hn-data-large"
          $p = Start-Process -FilePath $exe -ArgumentList '--selftest-large', $big, $out -PassThru
          if (-not $p.WaitForExit(400000)) { $p.Kill(); Fail "超时" }
          Remove-Item $big -ErrorAction SilentlyContinue
          if (-not (Test-Path $out)) { Fail "没有输出（退出码 $($p.ExitCode)）" }
          $r = Get-Content $out
          $r | Write-Host
          Write-Host ("::notice title=大文件性能::" + ($r -join '%0A'))
          if (-not ($r -contains 'result=pass')) { Fail ($r -join '%0A') }

      - name: 目录搜索基准（对比 ripgrep）
        shell: pwsh
        run: |
          function Fail($msg) { Write-Host "::error title=目录搜索基准::$msg"; exit 1 }
          $exe = (Resolve-Path "target\release\hurshnote.exe").Path
          $corpus = Join-Path $env:USERPROFILE ".cargo\registry\src"
          if (-not (Test-Path $corpus)) { Fail "找不到语料目录 $corpus" }
          if (-not (Get-Command rg -ErrorAction SilentlyContinue)) {
            choco install ripgrep -y --no-progress | Out-Null
            $env:Path += ";$env:ChocolateyInstall\bin"
          }
          $pattern = "unsafe"
          $out = Join-Path $env:RUNNER_TEMP "dirbench.txt"
          $p = Start-Process -FilePath $exe -ArgumentList '--bench-dirsearch', $corpus, $pattern, $out -PassThru
          if (-not $p.WaitForExit(300000)) { $p.Kill(); Fail "超时" }
          if (-not (Test-Path $out)) { Fail "没有输出（退出码 $($p.ExitCode)）" }
          $r = Get-Content $out
          # 输出重定向到 NUL，避免 PowerShell 管道的开销计入 ripgrep 的耗时
          cmd /c "rg -c -s $pattern `"$corpus`" > NUL"
          $rg = @()
          for ($i = 0; $i -lt 3; $i++) {
            $rg += (Measure-Command { cmd /c "rg -c -s $pattern `"$corpus`" > NUL" }).TotalMilliseconds
          }
          $rgMed = ($rg | Sort-Object)[1]
          $rgFiles = (cmd /c "rg -l -s $pattern `"$corpus`"" | Measure-Object -Line).Lines
          $ours = [double](($r | Where-Object { $_ -like 'dirsearch_ms=*' }) -replace 'dirsearch_ms=', '')
          $ratio = if ($rgMed -gt 0) { $ours / $rgMed } else { 0 }
          $extra = "rg_ms={0:N1}%0Arg_runs={1}%0Arg_files_matched={2}%0Aratio={3:N2}" -f $rgMed, (($rg | ForEach-Object { "{0:N1}" -f $_ }) -join ','), $rgFiles, $ratio
          Write-Host ("::notice title=目录搜索基准::" + ($r -join '%0A') + "%0A" + $extra)
          if (-not ($r -contains 'result=pass')) { Fail ($r -join '%0A') }
          if ($ratio -gt 1.3) { Write-Host ("::warning::目录搜索耗时是 ripgrep 的 {0:N2} 倍，超过 1.3 倍目标" -f $ratio) }

      - uses: actions/upload-artifact@v4
        with:
          name: hurshnote-${{ github.sha }}
          path: |
            target/release/hurshnote.exe
            target/release/hurshnote.pdb
            selftest.txt
            Cargo.lock
          if-no-files-found: warn

      # 供在云端环境中提交 Cargo.lock（日志与产物无法从云端下载，注解可以读取）
      - name: 输出锁文件
        if: hashFiles('Cargo.lock') != ''
        shell: pwsh
        run: |
          git diff --quiet -- Cargo.lock
          $changed = $LASTEXITCODE -ne 0
          if ($changed -or -not (git ls-files Cargo.lock)) {
            # 注解长度有限，分块输出
            $text = (Get-Content Cargo.lock -Raw) -replace "`r", ''
            $n = [math]::Ceiling($text.Length / 4000)
            for ($k = 0; $k -lt $n; $k++) {
              $part = $text.Substring($k * 4000, [math]::Min(4000, $text.Length - $k * 4000))
              Write-Host ("::notice title=Cargo.lock $($k + 1)/$n::" + ($part -replace '%','%25' -replace "`n",'%0A'))
            }
          }
          $global:LASTEXITCODE = 0

      - name: 发布 nightly 预发布版
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_nightly.py target/release/hurshnote.exe selftest.txt
