name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: never
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  # 跨平台 crate：格式检查、单元测试、clippy
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 安装工具链
        run: rustup toolchain install || rustup show

      - uses: Swatinem/rust-cache@v2

      - name: 格式检查
        run: python3 scripts/ci_run.py 格式检查 -- cargo fmt --all --check

      - name: Clippy
        run: python3 scripts/ci_run.py Clippy -- cargo clippy -p hn-text --all-targets -- -D warnings

      - name: 测试
        run: python3 scripts/ci_run.py 测试 -- cargo test -p hn-text

  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: 安装工具链
        run: rustup toolchain install || rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: python scripts/ci_run.py Clippy -- cargo clippy --workspace --all-targets -- -D warnings

      - name: 测试
        run: python scripts/ci_run.py 测试 -- cargo test --workspace

      - name: 构建 Release
        run: python scripts/ci_run.py 构建 -- cargo build --release

      - name: 检查依赖的 DLL（CRT 必须静态链接）
        run: python scripts/check_pe_imports.py target/release/hurshnote.exe

      - name: 启动自测
        shell: pwsh
        run: |
          function Fail($msg) { Write-Host "::error title=启动自测::$msg"; exit 1 }
          $exe = "target\release\hurshnote.exe"
          "exe 大小：{0:N2} MB" -f ((Get-Item $exe).Length / 1MB)
          $times = @()
          for ($i = 1; $i -le 5; $i++) {
            $out = Join-Path $env:RUNNER_TEMP "selftest-$i.txt"
            $p = Start-Process -FilePath $exe -ArgumentList '--selftest', $out -PassThru
            if (-not $p.WaitForExit(60000)) { $p.Kill(); Fail "第 $i 次自测超时" }
            if (-not (Test-Path $out)) { Fail "第 $i 次自测没有输出（退出码 $($p.ExitCode)）" }
            $report = Get-Content $out
            if ($i -eq 1) { $report | Write-Host; Copy-Item $out selftest.txt }
            if (-not ($report -contains 'result=pass')) { Fail ("第 $i 次自测失败%0A" + ($report -join '%0A')) }
            $ms = [double](($report | Where-Object { $_ -like 'startup_ms=*' }) -replace 'startup_ms=', '')
            $times += $ms
          }
          $sorted = $times | Sort-Object
          $median = $sorted[2]
          "启动耗时（ms）：$($times -join ', ')；中位数 $median"
          "startup_ms_median=$median" | Add-Content selftest.txt
          $sz = "exe_mb={0:N2}" -f ((Get-Item $exe).Length / 1MB)
          Write-Host ("::notice title=自测结果::" + ((Get-Content selftest.txt) -join '%0A') + "%0A$sz")
          if ($median -gt 150) { Write-Host "::warning::启动耗时中位数 $median ms，超过 150 ms 目标" }

      - uses: actions/upload-artifact@v4
        with:
          name: hurshnote-${{ github.sha }}
          path: |
            target/release/hurshnote.exe
            target/release/hurshnote.pdb
            selftest.txt
            Cargo.lock
          if-no-files-found: warn

      # 供在云端环境中提交 Cargo.lock（日志与产物无法从云端下载，注解可以读取）
      - name: 输出锁文件
        if: hashFiles('Cargo.lock') != ''
        shell: pwsh
        run: |
          if (-not (git ls-files Cargo.lock)) {
            Write-Host ("::notice title=Cargo.lock::" + ((Get-Content Cargo.lock -Raw) -replace '%','%25' -replace "`r",'' -replace "`n",'%0A'))
          }

      - name: 发布 nightly 预发布版
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\release\hurshnote.exe dist\
          Copy-Item LICENSE, selftest.txt dist\
          Compress-Archive -Path dist\* -DestinationPath hurshnote-nightly-x64.zip -Force
          gh release view nightly *> $null
          if ($LASTEXITCODE -eq 0) { gh release delete nightly --yes --cleanup-tag }
          $short = $env:GITHUB_SHA.Substring(0, 7)
          $notes = "main 分支最新构建（$short），未签名，首次运行时 Windows SmartScreen 可能提示，选择“仍要运行”即可。`n`n自测结果：`n``````n$(Get-Content selftest.txt -Raw)``````"
          gh release create nightly hurshnote-nightly-x64.zip target\release\hurshnote.exe --prerelease --title "Nightly $short" --notes $notes --target $env:GITHUB_SHA
