[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"
repository = "https://github.com/capsopasme/hurshnote"

[workspace.dependencies]
hn-text = { path = "crates/hn-text" }
hn-sci = { path = "crates/hn-sci" }
hn-search = { path = "crates/hn-search" }
hn-crypto = { path = "crates/hn-crypto" }
hn-core = { path = "crates/hn-core" }
hn-large = { path = "crates/hn-large" }
hn-render = { path = "crates/hn-render" }
hn-run = { path = "crates/hn-run" }
hn-term = { path = "crates/hn-term" }
hn-md = { path = "crates/hn-md" }
windows-sys = "0.59"
# 只用于 COM 接口（Direct2D / DirectWrite），普通 Win32 API 用 windows-sys
windows = "0.58"
cc = "1"
embed-resource = "2.5"
encoding_rs = "0.8"
chardetng = "0.1"
pcre2 = "0.2"
argon2 = "0.5"
aes-gcm = "0.10"
zeroize = "1"
getrandom = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ignore = "0.4"
memchr = "2"
pulldown-cmark = { version = "0.12", default-features = false }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
missing_safety_doc = "allow"

# 密码学 crate 在调试构建中也要优化，否则测试中的 Argon2 很慢
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.aes]
opt-level = 3
[profile.dev.package.aes-gcm]
opt-level = 3

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = "limited"
